<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Garage Icons Generator</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 20px;
        }
        canvas {
            border: 1px solid #333;
        }
        button {
            background: #dc2626;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover { background: #b91c1c; }
    </style>
</head>
<body>
    <h1>Garage Icon Generator</h1>
    <canvas id="canvas" width="512" height="512" style="width: 256px; height: 256px;"></canvas>
    <button id="download">Icons herunterladen</button>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function drawIcon(size) {
            canvas.width = size;
            canvas.height = size;

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, size, size);

            ctx.fillStyle = '#dc2626';
            ctx.font = `bold ${size * 0.45}px -apple-system, BlinkMacSystemFont, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('G', size / 2, size / 2);

            ctx.strokeStyle = '#dc2626';
            ctx.lineWidth = size * 0.02;
            ctx.strokeRect(size * 0.05, size * 0.05, size * 0.9, size * 0.9);
        }

        drawIcon(512);

        document.getElementById('download').addEventListener('click', () => {
            [192, 512].forEach(size => {
                drawIcon(size);
                const link = document.createElement('a');
                link.download = `icon-${size}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        });
    </script>
</body>
</html>
